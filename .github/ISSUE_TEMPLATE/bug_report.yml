name: Bug Report
description: Report an issue or unexpected behavior
title: "Short, descriptive title of the issue"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a problem with CrossInk Play on the Xteink X4 Pro. To add another game, use the [game request form](https://github.com/probablyangg/CrossInk-Play/issues/new?template=play-game-request.yml). Build and update instructions are in the [maintenance guide](https://github.com/probablyangg/CrossInk-Play/blob/main/docs/play-maintenance.md).

  - type: dropdown
    id: device-type
    attributes:
      label: Device
      description: CrossInk Play currently targets the Xteink X4 Pro.
      options:
        - X4 Pro
      default: 0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Affected Version
      description: CrossInk Play version and source commit, if available in the download's build-info.json.
      placeholder: 0.1.0-alpha.1
    validations:
      required: true

  - type: dropdown
    id: epub-state
    attributes:
      label: EPUB Optimization
      description: Is your EPUB optimized?
      options:
        - "--- Select ---"
        - No / Not Applicable
        - Yes, using the built-in web transfer EPUB optimizer
        - Yes, using a different EPUB optimizer
        - What is an EPUB optimizer?
    validations:
      required: true

  - type: dropdown
    id: cache-state
    attributes:
      label: Cache State
      description: Have you attempted to clear any cached data?
      options:
        - "--- Select ---"
        - No / Not Applicable
        - Yes, book cache (Reader menu > Delete Book Cache)
        - Yes, reading cache (Settings > System > Clear Reading Cache)
        - Yes, device cache (SD Card > ./crosspoint folder)
        - All of the above
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Clearly list the steps necessary to reproduce the unexpected behavior.
      placeholder: |
        1. Go to '...'
        2. Select '...'
        3. Crash
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: epub-attachment
    attributes:
      label: File Provided
      description: If the problem depends on a specific EPUB, XTC, or other file, attach it to this issue. EPUB and XTC files need to be zipped first.
      options:
        - "--- Select ---"
        - Not Applicable
        - I've attached it
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output/Screenshots
      description: If applicable, error messages, or log output to help explain your problem. If a crash_report.txt file was generated include it here or your issue may not be addressed in a timely manner. You can drag and drop images here.
      render: shell
