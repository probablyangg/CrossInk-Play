name: Play - Check upstream updates

"on":
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: Which project to check
        type: choice
        required: true
        default: both
        options:
          - both
          - crossink
          - crossplay

permissions:
  contents: read

concurrency:
  group: play-upstream
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'probablyangg/CrossInk-Play' && github.ref == 'refs/heads/main'
    name: Check ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        source: [crossink, crossplay]
    steps:
      - name: Read trusted maintenance code
        if: inputs.source == '' || inputs.source == 'both' || inputs.source == matrix.source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: inputs.source == '' || inputs.source == 'both' || inputs.source == matrix.source
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # The script only combines Git objects and prepares a draft PR. It never
      # builds, imports, or executes the proposed upstream code with this token.
      - name: Prepare an update when a new stable release exists
        if: inputs.source == '' || inputs.source == 'both' || inputs.source == matrix.source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_UPSTREAM_SOURCE: ${{ matrix.source }}
        run: |
          python3 scripts/play_upstream.py prepare \
            --source "$PLAY_UPSTREAM_SOURCE" \
            --output-dir ".maintenance-output/$PLAY_UPSTREAM_SOURCE" \
            --publish

      - name: Show the update report
        if: always() && (inputs.source == '' || inputs.source == 'both' || inputs.source == matrix.source)
        env:
          PLAY_UPSTREAM_SOURCE: ${{ matrix.source }}
        run: |
          report=".maintenance-output/$PLAY_UPSTREAM_SOURCE/prepare.md"
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The check did not finish. Open the failed step for its error.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the report and review files
        if: always() && (inputs.source == '' || inputs.source == 'both' || inputs.source == matrix.source)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upstream-${{ matrix.source }}-${{ github.run_id }}
          path: .maintenance-output/${{ matrix.source }}/
          if-no-files-found: warn
          retention-days: 30
